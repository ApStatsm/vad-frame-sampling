[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vad-frame-sampling"
version = "0.2.0"
description = "Frozen VadCLIP frame-sampling experiments, source-checkout workflow"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.7,<3", "torchvision>=0.22,<1",
  "numpy==2.2.6", "scipy==1.15.3", "pandas==2.2.3",
  "scikit-learn==1.7.2", "Pillow==11.3.0", "tqdm==4.67.1",
  "ftfy==6.3.1", "regex==2025.11.3", "packaging==25.0",
  "opencv-python-headless==5.0.0.93"
]

[tool.setuptools.packages.find]
include = ["vadfs*"]
